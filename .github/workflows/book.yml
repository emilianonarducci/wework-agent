name: Prenota WeWork

on:
  schedule:
    # Il cron di GitHub è in UTC. Mezzanotte italiana = 22:00 UTC (ora legale) o 23:00 UTC (ora solare):
    # parte a entrambi gli orari e book.py procede solo nel run che cade tra 00:00 e 00:59 in Italia.
    # Lo script calcola da solo la data (oggi + days_ahead) e salta i weekend.
    - cron: "2 22 * * *"
    - cron: "2 23 * * *"
  workflow_dispatch: {}   # per lanciarlo a mano dalla tab Actions

permissions:
  contents: write   # serve per salvare nel repo la sessione rinnovata (cifrata)

concurrency:
  group: wework-booking
  cancel-in-progress: false

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Ripristina sessione e template
        env:
          S: ${{ secrets.STORAGE_STATE_GZ_B64 }}
          T: ${{ secrets.BOOKING_TEMPLATE_GZ_B64 }}
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
        run: |
          python - <<'EOF'
          import base64, gzip, os
          open("booking_template.json", "wb").write(gzip.decompress(base64.b64decode(os.environ["T"])))
          open("storage_state.json", "wb").write(gzip.decompress(base64.b64decode(os.environ["S"])))
          EOF
          # Se c'è una sessione rinnovata più recente nel repo, usa quella
          if [ -f storage_state.enc ] && [ "$(cat .session_source 2>/dev/null)" = "repo" ]; then
            echo "Uso la sessione rinnovata salvata nel repo"
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:SESSION_KEY -in storage_state.enc -out storage_state.json
          fi

      - name: Prenota
        id: book
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
          ONLY_AFTER_MIDNIGHT: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: |
          set +e
          python book.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Salva la sessione rinnovata (cifrata) nel repo
        if: steps.book.outputs.code != '2'
        env:
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:SESSION_KEY -in storage_state.json -out storage_state.enc
          echo repo > .session_source
          git config user.name "wework-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage_state.enc .session_source
          git commit -m "Aggiorna sessione $(date -u +%F)" || exit 0
          git push

      - name: Esito
        if: steps.book.outputs.code != '0'
        run: exit ${{ steps.book.outputs.code }}
